# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      # SHA = tags oficiales (el validador del IDE a veces no resuelve @v* sin red/GitHub login)
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Repo hygiene (orphan imports)
        run: npm run check:orphans
      - name: Architecture guardrails
        run: npm run check:architecture
      - name: Anti-simulation guardrail
        run: npm run check:no-sim
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Anti-simulation guardrail (dist)
        run: npm run check:no-sim:dist
